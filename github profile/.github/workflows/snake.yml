name: Generate Contribution Snake

on:
  schedule:
    # Run every 12 hours
    - cron: "0 */12 * * *"
  
  # Allows manual execution anytime via the Actions tab
  workflow_dispatch:

  # Run automatically on push to the main branch
  push:
    branches:
      - main

# Explicit write permissions to commit generated SVGs to the output branch
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Contribution Grid Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Yugpatel009
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#54F7FF&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Generated SVGs to output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
